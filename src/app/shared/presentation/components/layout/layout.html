<mat-toolbar class="app-toolbar" role="banner">
  <img class="logo" [src]="logoUrl" alt="GitHub" width="32" height="32">
  <span class="title">{{ 'layout.title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher/>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav class="sidenav"
               mode="side" opened
               [attr.aria-label]="'layout.navigation' | translate">
    <nav [attr.aria-label]="'layout.navigation' | translate">
      <mat-nav-list>
        @for (option of options(); track option.link) {
          <a mat-list-item [routerLink]="option.link" routerLinkActive="active-link"
             ariaCurrentWhenActive="page">
            <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
            <span matListItemTitle>{{ option.label | translate }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main>
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
