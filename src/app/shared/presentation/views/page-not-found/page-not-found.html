<section class="not-found" aria-labelledby="not-found-title">
  <h1 id="not-found-title">{{ 'page-not-found.title' | translate }}</h1>
  <p role="alert">{{ 'page-not-found.content' | translate: { path: invalidPath } }}</p>
  <button mat-flat-button type="button" (click)="navigateToHome()">
    {{ 'page-not-found.go-home' | translate }}
  </button>
</section>
